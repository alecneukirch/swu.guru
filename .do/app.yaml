name: swuguru
region: nyc

services:
  - name: app
    image:
      registry_type: DOCR
      registry: aces-ombi
      repository: swuguru
      tag: latest
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xs
    health_check:
      http_path: /health
      initial_delay_seconds: 20
      period_seconds: 30
      timeout_seconds: 10
    routes:
      - path: /
    envs:
      - key: DATABASE_URL
        value: ${swuguru-db.DATABASE_URL}
        type: SECRET

databases:
  - cluster_name: swuguru-db
    db_name: swu_cards
    db_user: doadmin
    engine: PG
    name: swuguru-db
    production: true

domains:
  - domain: swu.guru
    type: PRIMARY
